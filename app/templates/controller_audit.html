<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Audit Trail</title>
<style>
  :root{--bg:#08080c;--card:#0f0f14;--gold:#c8a96e;--text:#f2f0eb;--muted:#8a8680;}
  body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;padding:2rem;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2.2rem;}
  .card{background:var(--card);border:1px solid rgba(200,169,110,0.1);border-radius:14px;padding:1.5rem;}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  th{color:var(--gold);text-align:left;padding:0.6rem 0.4rem;border-bottom:1px solid rgba(200,169,110,0.2);font-size:0.7rem;text-transform:uppercase;}
  td{padding:0.7rem 0.4rem;border-bottom:1px solid rgba(255,255,255,0.03);font-size:0.85rem;}
  .tag{display:inline-block;padding:0.15rem 0.45rem;border-radius:999px;font-size:0.7rem;font-weight:600;background:rgba(200,169,110,0.15);color:var(--gold);}
  a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>
  <h1>Audit <span style="color:var(--gold);font-style:italic;">Trail</span></h1>
  <p><a href="/controller/api/audit/export" style="display:inline-block;background:var(--gold);color:#0a0a0c;padding:0.5rem 1rem;border-radius:6px;font-weight:600;text-decoration:none;margin-bottom:1rem;">Export CSV ↓</a></p>
  <div class="card">
    <table>
      <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Description</th></tr></thead>
      <tbody>
      {% for log in logs %}
        <tr>
          <td>{{ log.timestamp }}</td>
          <td>{{ log.user }}</td>
          <td><span class="tag">{{ log.action }}</span></td>
          <td>{{ log.entity }}</td>
          <td style="font-size:0.8rem;color:var(--muted);">{{ log.description }}</td>
        </tr>
      {% else %}
        <tr><td colspan="5" style="color:var(--muted);">No audit entries yet.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  <p style="margin-top:2rem;">
  <a href="/controller/dashboard" style="color:#c8a96e; text-decoration:none; font-size:0.85rem; letter-spacing:0.03em; border-bottom:1px solid rgba(200,169,110,0.3); padding-bottom:0.1rem; transition:color 0.2s;">
    ← Back to Controller Command
  </a>
</p>
</body>
</html>
